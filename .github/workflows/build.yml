name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.8'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build apk --release
      # Widget « La une » : lecture de l'API et rendu, sur la JVM (Robolectric).
      - run: ./gradlew :app:testDebugUnitTest
        working-directory: android
      - run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: lebienheureux-android
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
            android/app/build/widget-preview/

  ios:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Build non signée (app + widget « La une ») : vérifie que tout compile.
      # La signature et l'envoi sur TestFlight demandent un compte Apple Developer.
      - run: flutter build ios --release --no-codesign
      - run: cd build/ios/iphoneos && zip -qr ../../../Runner-unsigned.zip Runner.app
      - uses: actions/upload-artifact@v4
        with:
          name: lebienheureux-ios-unsigned
          path: Runner-unsigned.zip

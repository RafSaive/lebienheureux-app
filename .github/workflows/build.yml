name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.8'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: lebienheureux-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  ios:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Build non signée : vérifie que l'app compile pour iOS.
      # La signature et l'envoi sur TestFlight demandent un compte Apple Developer.
      - run: flutter build ios --release --no-codesign
      - run: cd build/ios/iphoneos && zip -qr ../../../Runner-unsigned.zip Runner.app
      - uses: actions/upload-artifact@v4
        with:
          name: lebienheureux-ios-unsigned
          path: Runner-unsigned.zip
